[env:proton]
platform = https://github.com/norandomtechie/platform-raspberrypi.git#feature/proton-picosdk-support
board = proton                    ; ← this is required
framework = picosdk
debug_tool = picoprobe
upload_protocol = picoprobe
monitor_speed = 115200

build_flags =
    -DUSE_TINYUSB=1
    -DPICO_STDIO_USB=0              ; disable default CDC descriptors to avoid conflicts
    -DCFG_TUD_HID=1                 ; explicitly enable HID class
    -Wl,--whole-archive -ltinyusb_device -Wl,--no-whole-archive
    -L"C:/Users/zsyde/.platformio/packages/framework-picosdk/lib/tinyusb"  ; adjust if your path differs