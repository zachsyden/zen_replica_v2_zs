[env:proton]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#develop
board = rpipico2                    ; Raspberry Pi Pico 2 (RP2350) - matches your Proton board's MCU
framework = picosdk
debug_tool = picoprobe
upload_protocol = picoprobe
monitor_speed = 115200
build_flags =
    -DUSE_TINYUSB=1                 ; This enables TinyUSB device mode + auto-links libraries
    -DCFG_TUSB_MCU=OPT_MCU_RP2350   ; Explicit for RP2350 (avoids RP2040 fallback bugs)