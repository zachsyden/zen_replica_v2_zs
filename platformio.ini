[env:proton]
platform = https://github.com/norandomtechie/platform-raspberrypi.git#feature/proton-picosdk-support
board = proton
framework = picosdk
debug_tool = picoprobe
upload_protocol = picoprobe
build_src_flags = -O0
monitor_speed = 115200

build_flags =
    -DUSE_TINYUSB=1
    -DPICO_STDIO_USB=0
    -DPICO_TINYUSB_PATH="${PICO_SDK_PATH}/lib/tinyusb"
    -DCFG_TUSB_CONFIG_FILE=\"tusb_config.h\"
    -I"C:/Users/zsyde/.platformio/packages/framework-picosdk/lib/tinyusb/src"
    -I"C:/Users/zsyde/.platformio/packages/framework-picosdk/lib/tinyusb/src/common"
    -I"C:/Users/zsyde/.platformio/packages/framework-picosdk/lib/tinyusb/src/device"
    -I"C:/Users/zsyde/.platformio/packages/framework-picosdk/lib/tinyusb/src/portable/raspberrypi"
    -DCFG_TUSB_MCU=OPT_MCU_RP2040
    ; NEW: Force link TinyUSB device objects
    -Wl,--whole-archive
    -l tinyusb_device
    -Wl,--no-whole-archive